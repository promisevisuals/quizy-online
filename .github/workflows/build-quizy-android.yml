name: Build Quizy Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-quizy-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Quizy signing key
        env:
          KEYSTORE_B64: ${{ secrets.QUIZY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing QUIZY_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quizy-release.keystore"
      - name: Build signed release APK
        working-directory: android
        env:
          QUIZY_KEYSTORE_FILE: ${{ runner.temp }}/quizy-release.keystore
          QUIZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZY_KEYSTORE_PASSWORD }}
          QUIZY_KEY_PASSWORD: ${{ secrets.QUIZY_KEY_PASSWORD }}
        run: |
          test -n "$QUIZY_KEYSTORE_PASSWORD" || { echo "Missing QUIZY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$QUIZY_KEY_PASSWORD" || { echo "Missing QUIZY_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Quizy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Quizy-release-apk
          path: ${{ runner.temp }}/Quizy.apk
          retention-days: 30
      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep versionName android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          TAG="quizy-android-v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$RUNNER_TEMP/Quizy.apk" --title "Quizy Android $VERSION" --notes "Quizy Android app $VERSION. Bluetooth battle: fixed messages between phones, permission and pairing help." --latest
